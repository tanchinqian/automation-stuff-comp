name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-and-build:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Engine & Vision Unit Tests
        run: npm test

      - name: Build Production Frontend (tsc + vite)
        run: npm run build

  docker-verification:
    name: Verify Docker Build & Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: docker compose build

      - name: Launch Container
        run: docker compose up -d

      - name: Wait for API & Models to Initialize
        run: |
          echo "Waiting for PasteTrace container to become healthy..."
          HEALTHY=0
          for i in $(seq 1 40); do
            RESPONSE=$(curl --silent --fail http://localhost:8000/health || true)
            if echo "$RESPONSE" | grep -q "ok"; then
              echo "Server healthy on port 8000!"
              HEALTHY=1
              break
            fi
            echo "Waiting for server to start... ($i/40)"
            sleep 3
          done
          if [ $HEALTHY -ne 1 ]; then
            echo "ERROR: Server failed to start within timeout"
            docker compose logs pastetrace
            exit 1
          fi

      - name: Verify Health & API Endpoints
        run: |
          docker compose ps
          docker compose logs pastetrace
          curl --fail -s http://localhost:8000/health
          curl --fail -s http://localhost:8000/boards | head -c 200
          curl --fail -s -I http://localhost:8000/

      - name: Stop Container
        if: always()
        run: docker compose down
