name: CI & QA Validation

on:
  push:
    branches: [ main, Nazarick, elson, "**" ]
  pull_request:
    branches: [ main, Nazarick ]

jobs:
  validate:
    name: Build, Test & QA Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Engine & Vision Sanity Checks
        run: npm test

      - name: Run Automated Benchmark & Schema Integrity Suite
        run: npm run test:benchmark

      - name: Verify TypeScript & Production Build
        run: npm run build
